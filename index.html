<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17151f">
  <meta name="description" content="Encuentra aquí mis redes sociales y enlaces oficiales.">
  <title>Mika Veil links</title>
  <style>
    :root {
      /* PERSONALIZA AQUÍ LOS COLORES */
      --bg: #17151f;
      --card: rgba(255,255,255,.075);
      --card-hover: rgba(255,255,255,.13);
      --text: #fbf8ff;
      --muted: #c2bbce;
      --accent: #d8a7ff;
      --border: rgba(255,255,255,.13);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; padding: 34px 18px 28px;
      display: flex; justify-content: center; align-items: center;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(133, 75, 181, .27), transparent 42%),
        radial-gradient(ellipse at 90% 85%, rgba(72, 92, 160, .20), transparent 38%),
        var(--bg);
    }
    .page { width: 100%; max-width: 460px; text-align: center; }
    .avatar {
      width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
      display: block; margin: 0 auto 17px; border: 3px solid rgba(255,255,255,.8);
      box-shadow: 0 8px 32px rgba(0,0,0,.25); background: #393044;
    }
    h1 { font-size: clamp(1.65rem, 5vw, 2rem); margin: 0; letter-spacing: -.035em; }
    .bio { margin: 10px auto 24px; max-width: 340px; color: var(--muted); line-height: 1.55; font-size: .97rem; }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; gap: 13px; width: 100%; min-height: 60px;
      padding: 15px 18px; border: 1px solid var(--border); border-radius: 16px;
      background: var(--card); color: var(--text); text-decoration: none;
      font-weight: 650; font-size: 1rem; text-align: left;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover, .link:focus-visible {
      background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px); outline: none;
    }
    .link:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
    .symbol {
      width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center;
      border-radius: 11px; color: #21162d; background: var(--accent); font-size: 17px; font-weight: 800;
    }
    .link-label { flex: 1; }
    .arrow { color: var(--muted); font-size: 1.25rem; }
    footer { margin-top: 26px; color: var(--muted); font-size: .78rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="page">
    <!-- Cambia la URL de la foto por una imagen pública tuya. -->
    <img class="avatar" src="PFP.png" alt="Foto de perfil" onerror="this.style.display='none'">

    <!-- Personaliza tu nombre y descripción. -->
    <h1>Mika Veil</h1>
    <p class="bio">✨ Content creator & dream girl in pixels (⁠*⁠´⁠ω⁠｀⁠*⁠) ✨ Faceless & masked content</p>

    <!-- Cambia cada href por el enlace correcto. Duplica un bloque <a> para añadir otro botón. -->
    <nav class="links" aria-label="Mis enlaces">
      <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
        <span class="symbol" aria-hidden="true">◎</span><span class="link-label">Instagram</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
        <span class="symbol" aria-hidden="true">♪</span><span class="link-label">TikTok</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://x.com/" target="_blank" rel="noopener noreferrer">
        <span class="symbol" aria-hidden="true">𝕏</span><span class="link-label">X / Twitter</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="symbol" aria-hidden="true">▶</span><span class="link-label">YouTube</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://example.com/" target="_blank" rel="noopener noreferrer">
        <span class="symbol" aria-hidden="true">♡</span><span class="link-label">Mi contenido exclusivo</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="mailto:tu-correo@ejemplo.com">
        <span class="symbol" aria-hidden="true">✉</span><span class="link-label">Contacto</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>♡</footer>
  </main>
</body>
</html>
